<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_npm_download_trend_reporter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F0407" /><stop offset="50%" stop-color="#380C10" /><stop offset="100%" stop-color="#140204" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_npm_download_trend_reporter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.95" /><stop offset="50%" stop-color="#CB3837" stop-opacity="0.5" /><stop offset="100%" stop-color="#F87171" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_npm_download_trend_reporter" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#CB3837" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#CB3837" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#CB3837" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_npm_download_trend_reporter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_npm_download_trend_reporter" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_npm_download_trend_reporter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_npm_download_trend_reporter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_npm_download_trend_reporter)" stroke="url(#borderGrad_npm_download_trend_reporter)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_npm_download_trend_reporter)" />
  
        <g stroke="#BE123C" stroke-opacity="0.12" fill="none" stroke-width="1.5">
          <polygon points="256,120 286,137 286,172 256,189 226,172 226,137" />
          <polygon points="196,155 226,172 226,207 196,224 166,207 166,172" />
          <polygon points="316,155 346,172 346,207 316,224 286,207 286,172" />
          <polygon points="256,224 286,241 286,276 256,293 226,276 226,241" />
          <polygon points="196,259 226,276 226,311 196,328 166,311 166,276" />
          <polygon points="316,259 346,276 346,311 316,328 286,311 286,276" />
          <polygon points="256,328 286,345 286,380 256,397 226,380 226,345" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_npm_download_trend_reporter)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_npm_download_trend_reporter)">
    
    <!-- npm Red Cube on Left -->
    <rect x="130" y="160" width="120" height="85" rx="14" fill="#CB3837" />
    <g fill="#FFFFFF" transform="translate(145, 180) scale(0.55)">
      <path d="M 0 0 L 45 0 L 45 80 L 30 80 L 30 30 L 15 30 L 15 80 L 0 80 Z" />
      <path d="M 55 0 L 105 0 L 105 55 L 75 55 L 75 80 L 55 80 Z M 70 15 L 90 15 L 90 40 L 70 40 Z" />
      <path d="M 115 0 L 165 0 L 165 80 L 150 80 L 150 30 L 140 30 L 140 80 L 125 80 L 125 30 L 115 30 Z" />
    </g>
    <!-- Exponential Download Graph -->
    <path d="M 140 360 L 220 340 L 290 280 L 370 170" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" />
    <polygon points="370,170 345,178 360,198" fill="#F59E0B" />
    <!-- Rising Flame -->
    <circle cx="370" cy="170" r="12" fill="#EF4444" />
    <!-- 10M+ Downloads Badge -->
    <rect x="230" y="330" width="150" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <text x="305" y="353" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">10M+ DL / MO</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_npm_download_trend_reporter)">
    <rect x="250" y="56" width="198" height="42" rx="21" fill="#450A0A" stroke="#EF4444" stroke-width="2.2" />
    <circle cx="270" cy="77" r="5.5" fill="#F87171" filter="url(#softGlow_npm_download_trend_reporter)" />
    <text x="358" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FFFBEB" letter-spacing="1.5">NPM TRENDS</text>
  </g>
</svg>