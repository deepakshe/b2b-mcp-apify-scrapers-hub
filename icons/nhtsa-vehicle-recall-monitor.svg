<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_nhtsa_vehicle_recall_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191106" /><stop offset="50%" stop-color="#32220C" /><stop offset="100%" stop-color="#130C04" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_nhtsa_vehicle_recall_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.95" /><stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5" /><stop offset="100%" stop-color="#D97706" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_nhtsa_vehicle_recall_monitor" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_nhtsa_vehicle_recall_monitor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_nhtsa_vehicle_recall_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_nhtsa_vehicle_recall_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_nhtsa_vehicle_recall_monitor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_nhtsa_vehicle_recall_monitor)" stroke="url(#borderGrad_nhtsa_vehicle_recall_monitor)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_nhtsa_vehicle_recall_monitor)" />
  
        <g stroke="#8B5CF6" stroke-opacity="0.14" fill="none" stroke-width="1.8">
          <path d="M 60 256 L 140 256 L 160 220 L 180 290 L 200 230 L 220 270 L 240 256 L 452 256" />
          <line x1="60" y1="170" x2="452" y2="170" stroke-opacity="0.07" stroke-dasharray="4 6" />
          <line x1="60" y1="340" x2="452" y2="340" stroke-opacity="0.07" stroke-dasharray="4 6" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_nhtsa_vehicle_recall_monitor)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_nhtsa_vehicle_recall_monitor)">
    
    <!-- Aerodynamic Sports Car Front Profile -->
    <path d="M 160 270 L 190 200 L 322 200 L 352 270 L 360 290 L 152 290 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
    <!-- Windshield -->
    <polygon points="200,205 312,205 330,250 182,250" fill="#0EA5E9" opacity="0.6" />
    <!-- Headlights -->
    <ellipse cx="180" cy="275" rx="14" ry="7" fill="#FEF08A" />
    <ellipse cx="332" cy="275" rx="14" ry="7" fill="#FEF08A" />
    <!-- Flashing Warning Beacon on Roof -->
    <circle cx="256" cy="180" r="14" fill="#F59E0B" stroke="#FEF08A" stroke-width="3" />
    <!-- Automotive Safety Pill -->
    <rect x="146" y="346" width="220" height="38" rx="19" fill="#1F2937" stroke="#F59E0B" stroke-width="2.5" />
    <text x="256" y="370" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">VIN &amp; SAFETY RECALL</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_nhtsa_vehicle_recall_monitor)">
    <rect x="250" y="56" width="198" height="42" rx="21" fill="#451A03" stroke="#F59E0B" stroke-width="2.2" />
    <circle cx="270" cy="77" r="5.5" fill="#FBBF24" filter="url(#softGlow_nhtsa_vehicle_recall_monitor)" />
    <text x="358" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FEF3C7" letter-spacing="1.5">NHTSA AUTO</text>
  </g>
</svg>