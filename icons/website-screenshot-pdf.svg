<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_website_screenshot_pdf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140E15" /><stop offset="50%" stop-color="#261A28" /><stop offset="100%" stop-color="#0F0A10" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_website_screenshot_pdf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.95" /><stop offset="50%" stop-color="#A855F7" stop-opacity="0.5" /><stop offset="100%" stop-color="#FB7185" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_website_screenshot_pdf" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#F43F5E" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_website_screenshot_pdf" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_website_screenshot_pdf" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_website_screenshot_pdf" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_website_screenshot_pdf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_website_screenshot_pdf)" stroke="url(#borderGrad_website_screenshot_pdf)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_website_screenshot_pdf)" />
  
        <g stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1.5">
          <line x1="60" y1="140" x2="452" y2="330" />
          <line x1="60" y1="200" x2="452" y2="390" />
          <line x1="60" y1="260" x2="452" y2="450" />
          <line x1="452" y1="140" x2="60" y2="330" />
          <line x1="452" y1="200" x2="60" y2="390" />
          <line x1="452" y1="260" x2="60" y2="450" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_website_screenshot_pdf)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_website_screenshot_pdf)">
    
    <!-- Web Browser Left -->
    <g transform="translate(-30, -10) scale(0.9)">
      <rect x="146" y="150" width="200" height="150" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="3" />
      <rect x="146" y="150" width="200" height="26" rx="16" fill="#1E293B" />
      <circle cx="165" cy="163" r="4" fill="#EF4444" />
      <circle cx="177" cy="163" r="4" fill="#F59E0B" />
      <circle cx="189" cy="163" r="4" fill="#10B981" />
    </g>
    <!-- Adobe PDF Badge Right -->
    <rect x="260" y="210" width="120" height="140" rx="14" fill="#DC2626" stroke="#FEF2F2" stroke-width="3" />
    <text x="320" y="260" font-family="sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" text-anchor="middle">PDF</text>
    <rect x="280" y="280" width="80" height="8" rx="4" fill="#FFFFFF" />
    <rect x="280" y="298" width="60" height="8" rx="4" fill="#FFFFFF" />
    <!-- Camera Lens in Center -->
    <circle cx="230" cy="260" r="32" fill="#1E293B" stroke="#F59E0B" stroke-width="4" />
    <circle cx="230" cy="260" r="16" fill="#38BDF8" />
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_website_screenshot_pdf)">
    <rect x="218" y="56" width="230" height="42" rx="21" fill="#3B0725" stroke="#F43F5E" stroke-width="2.2" />
    <circle cx="238" cy="77" r="5.5" fill="#FB7185" filter="url(#softGlow_website_screenshot_pdf)" />
    <text x="342" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FFF1F2" letter-spacing="1.5">SCREEN & PDF</text>
  </g>
</svg>