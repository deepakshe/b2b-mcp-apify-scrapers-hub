<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_linkedin_public_company_profiler" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06101E" /><stop offset="50%" stop-color="#0B2545" /><stop offset="100%" stop-color="#133E68" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_linkedin_public_company_profiler" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.8" /><stop offset="50%" stop-color="#38BDF8" stop-opacity="0.4" /><stop offset="100%" stop-color="#93C5FD" stop-opacity="0.7" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_linkedin_public_company_profiler" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_linkedin_public_company_profiler" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_linkedin_public_company_profiler" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_linkedin_public_company_profiler" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_linkedin_public_company_profiler" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_linkedin_public_company_profiler)" stroke="url(#borderGrad_linkedin_public_company_profiler)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_linkedin_public_company_profiler)" />
  
        <g stroke="#38BDF8" stroke-opacity="0.12" fill="#38BDF8" fill-opacity="0.25" stroke-width="1.5">
          <line x1="120" y1="160" x2="200" y2="130" /><circle cx="120" cy="160" r="3" />
          <line x1="200" y1="130" x2="310" y2="150" /><circle cx="200" cy="130" r="4" />
          <line x1="310" y1="150" x2="390" y2="190" /><circle cx="310" cy="150" r="3" />
          <line x1="120" y1="160" x2="160" y2="280" />
          <line x1="160" y1="280" x2="256" y2="350" /><circle cx="160" cy="280" r="4" />
          <line x1="256" y1="350" x2="370" y2="320" /><circle cx="256" cy="350" r="4" />
          <line x1="370" y1="320" x2="390" y2="190" /><circle cx="370" cy="320" r="3" /><circle cx="390" cy="190" r="4" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_linkedin_public_company_profiler)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_linkedin_public_company_profiler)">
    
        <!-- Corporate Org Chart Matrix -->
        <rect x="216" y="150" width="80" height="42" rx="10" fill="#0369A1" stroke="#38BDF8" stroke-width="2.5" />
        <line x1="256" y1="192" x2="256" y2="230" stroke="#38BDF8" stroke-width="3" />
        <line x1="176" y1="230" x2="336" y2="230" stroke="#38BDF8" stroke-width="3" />
        <line x1="176" y1="230" x2="176" y2="260" stroke="#38BDF8" stroke-width="3" />
        <line x1="336" y1="230" x2="336" y2="260" stroke="#38BDF8" stroke-width="3" />
        <rect x="136" y="260" width="80" height="42" rx="10" fill="#0B2545" stroke="#0284C7" stroke-width="2" />
        <rect x="296" y="260" width="80" height="42" rx="10" fill="#0B2545" stroke="#0284C7" stroke-width="2" />
        <!-- Verified Corporate Hologram Seal -->
        <circle cx="256" cy="335" r="32" fill="#0284C7" stroke="#38BDF8" stroke-width="2.5" />
        <polygon points="256,315 263,329 278,331 267,341 270,356 256,348 242,356 245,341 234,331 249,329" fill="#FDE047" />
        
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_linkedin_public_company_profiler)">
    <rect x="336" y="56" width="112" height="42" rx="21" fill="#0C2340" stroke="#38BDF8" stroke-width="2.2" />
    <circle cx="356" cy="77" r="5.5" fill="#7DD3FC" filter="url(#softGlow_linkedin_public_company_profiler)" />
    <text x="401" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#F0F9FF" letter-spacing="1.5">CORP</text>
  </g>
</svg>