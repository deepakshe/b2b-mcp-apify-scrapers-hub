<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_world_bank_project_pipeline_matcher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D1E" /><stop offset="50%" stop-color="#0A1B3B" /><stop offset="100%" stop-color="#030A17" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_world_bank_project_pipeline_matcher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC00" stop-opacity="0.95" /><stop offset="50%" stop-color="#003399" stop-opacity="0.5" /><stop offset="100%" stop-color="#FBBF24" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_world_bank_project_pipeline_matcher" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#FFCC00" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#FFCC00" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFCC00" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_world_bank_project_pipeline_matcher" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_world_bank_project_pipeline_matcher" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_world_bank_project_pipeline_matcher" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_world_bank_project_pipeline_matcher" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_world_bank_project_pipeline_matcher)" stroke="url(#borderGrad_world_bank_project_pipeline_matcher)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_world_bank_project_pipeline_matcher)" />
  
        <g stroke="#38BDF8" stroke-opacity="0.12" fill="#38BDF8" fill-opacity="0.25" stroke-width="1.5">
          <line x1="120" y1="160" x2="200" y2="130" /><circle cx="120" cy="160" r="3" />
          <line x1="200" y1="130" x2="310" y2="150" /><circle cx="200" cy="130" r="4" />
          <line x1="310" y1="150" x2="390" y2="190" /><circle cx="310" cy="150" r="3" />
          <line x1="120" y1="160" x2="160" y2="280" />
          <line x1="160" y1="280" x2="256" y2="350" /><circle cx="160" cy="280" r="4" />
          <line x1="256" y1="350" x2="370" y2="320" /><circle cx="256" cy="350" r="4" />
          <line x1="370" y1="320" x2="390" y2="190" /><circle cx="370" cy="320" r="3" /><circle cx="390" cy="190" r="4" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_world_bank_project_pipeline_matcher)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_world_bank_project_pipeline_matcher)">
    
    <!-- 3D Globe with Infrastructure Crane -->
    <circle cx="230" cy="230" r="75" fill="#0B132B" stroke="#38BDF8" stroke-width="3" />
    <ellipse cx="230" cy="230" rx="75" ry="30" fill="none" stroke="#38BDF8" stroke-width="2" />
    <!-- Construction Crane -->
    <g stroke="#F59E0B" stroke-width="3" fill="none">
      <line x1="310" y1="310" x2="310" y2="160" />
      <line x1="310" y1="160" x2="370" y2="160" />
      <line x1="310" y1="180" x2="350" y2="160" />
      <line x1="360" y1="160" x2="360" y2="210" stroke-dasharray="3 3" />
    </g>
    <!-- Project Pipeline Pill -->
    <rect x="146" y="356" width="220" height="36" rx="18" fill="#172554" stroke="#38BDF8" stroke-width="2" />
    <text x="256" y="379" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">GLOBAL INFRASTRUCTURE</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_world_bank_project_pipeline_matcher)">
    <rect x="250" y="56" width="198" height="42" rx="21" fill="#172554" stroke="#FFCC00" stroke-width="2.2" />
    <circle cx="270" cy="77" r="5.5" fill="#FBBF24" filter="url(#softGlow_world_bank_project_pipeline_matcher)" />
    <text x="358" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FEF3C7" letter-spacing="1.5">WORLD BANK</text>
  </g>
</svg>