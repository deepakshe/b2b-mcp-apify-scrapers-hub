<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_world_bank_project_pipeline_matcher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1124" /><stop offset="50%" stop-color="#14213D" /><stop offset="100%" stop-color="#1E3258" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_world_bank_project_pipeline_matcher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" /><stop offset="50%" stop-color="#FCD34D" stop-opacity="0.4" /><stop offset="100%" stop-color="#60A5FA" stop-opacity="0.7" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_world_bank_project_pipeline_matcher" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#D97706" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_world_bank_project_pipeline_matcher" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_world_bank_project_pipeline_matcher" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_world_bank_project_pipeline_matcher" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_world_bank_project_pipeline_matcher" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_world_bank_project_pipeline_matcher)" stroke="url(#borderGrad_world_bank_project_pipeline_matcher)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_world_bank_project_pipeline_matcher)" />
  
        <g stroke="#F59E0B" stroke-opacity="0.12" fill="none" stroke-width="1.5">
          <circle cx="256" cy="256" r="90" />
          <circle cx="256" cy="256" r="140" stroke-dasharray="6 6" />
          <circle cx="256" cy="256" r="190" />
          <line x1="256" y1="60" x2="256" y2="452" stroke-opacity="0.08" />
          <line x1="60" y1="256" x2="452" y2="256" stroke-opacity="0.08" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_world_bank_project_pipeline_matcher)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_world_bank_project_pipeline_matcher)">
    
        <!-- World Bank Globe & Compass Navigation -->
        <circle cx="256" cy="235" r="75" fill="#0C1B33" stroke="#F59E0B" stroke-width="3" />
        <ellipse cx="256" cy="235" rx="75" ry="32" fill="none" stroke="#FBBF24" stroke-width="2" />
        <line x1="256" y1="160" x2="256" y2="310" stroke="#FBBF24" stroke-width="2" />
        <!-- Infrastructure Project Crane / Compass -->
        <path d="M 220 330 L 256 260 L 292 330" fill="none" stroke="#FDE047" stroke-width="4" stroke-linecap="round" />
        <circle cx="256" cy="260" r="8" fill="#FEF08A" />
        
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_world_bank_project_pipeline_matcher)">
    <rect x="336" y="56" width="112" height="42" rx="21" fill="#451A03" stroke="#F59E0B" stroke-width="2.2" />
    <circle cx="356" cy="77" r="5.5" fill="#FBBF24" filter="url(#softGlow_world_bank_project_pipeline_matcher)" />
    <text x="401" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FEF3C7" letter-spacing="1.5">WB</text>
  </g>
</svg>