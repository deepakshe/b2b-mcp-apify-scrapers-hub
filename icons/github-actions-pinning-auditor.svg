<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_github_actions_pinning_auditor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" /><stop offset="50%" stop-color="#161B22" /><stop offset="100%" stop-color="#090D12" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_github_actions_pinning_auditor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.9" /><stop offset="50%" stop-color="#6E7681" stop-opacity="0.5" /><stop offset="100%" stop-color="#A78BFA" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_github_actions_pinning_auditor" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_github_actions_pinning_auditor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_github_actions_pinning_auditor" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_github_actions_pinning_auditor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_github_actions_pinning_auditor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_github_actions_pinning_auditor)" stroke="url(#borderGrad_github_actions_pinning_auditor)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_github_actions_pinning_auditor)" />
  
        <g stroke="#10B981" stroke-opacity="0.14" fill="none" stroke-width="2" stroke-linecap="round">
          <path d="M 80 180 L 140 180 L 170 210 L 170 270" /><circle cx="80" cy="180" r="4" fill="#10B981" />
          <path d="M 432 180 L 372 180 L 342 210 L 342 260" /><circle cx="432" cy="180" r="4" fill="#10B981" />
          <path d="M 120 380 L 180 380 L 210 350 L 210 310" /><circle cx="120" cy="380" r="4" fill="#10B981" />
          <path d="M 392 380 L 332 380 L 302 350 L 302 310" /><circle cx="392" cy="380" r="4" fill="#10B981" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_github_actions_pinning_auditor)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_github_actions_pinning_auditor)">
    
    <!-- GitHub Octocat Silhouette -->
    <g transform="translate(256, 230) scale(1.1)">
      <path d="M 0 -80 C -44 -80, -80 -44, -80 0 C -80 35, -57 65, -25 76 C -21 77, -23 72, -23 69 L -23 44 C -45 49, -50 33, -50 33 C -54 23, -60 20, -60 20 C -67 15, -59 15, -59 15 C -51 16, -47 24, -47 24 C -40 36, -29 32, -25 30 C -24 25, -22 22, -20 20 C -38 18, -56 11, -56 -20 C -56 -29, -53 -36, -47 -42 C -48 -44, -51 -52, -46 -63 C -46 -63, -39 -65, -23 -54 C -16 -56, -8 -57, 0 -57 C 8 -57, 16 -56, 23 -54 C 39 -65, 46 -63, 46 -63 C 51 -52, 48 -44, 47 -42 C 53 -36, 56 -29, 56 -20 C 56 11, 38 18, 20 20 C 22 22, 24 26, 24 32 L 24 69 C 24 72, 22 77, 26 76 C 58 65, 80 35, 80 0 C 80 -44, 44 -80, 0 -80 Z" fill="#FFFFFF" />
    </g>
    <!-- Golden Security Hash Pin & Lock -->
    <rect x="290" y="270" width="80" height="70" rx="14" fill="#D97706" stroke="#FEF08A" stroke-width="3" />
    <path d="M 310 270 L 310 250 C 310 235, 350 235, 350 250 L 350 270" fill="none" stroke="#FEF08A" stroke-width="6" />
    <circle cx="330" cy="300" r="7" fill="#FFFFFF" />
    <line x1="330" y1="305" x2="330" y2="325" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_github_actions_pinning_auditor)">
    <rect x="250" y="56" width="198" height="42" rx="21" fill="#161B22" stroke="#8B5CF6" stroke-width="2.2" />
    <circle cx="270" cy="77" r="5.5" fill="#A78BFA" filter="url(#softGlow_github_actions_pinning_auditor)" />
    <text x="358" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#F0F9FF" letter-spacing="1.5">GH ACTIONS</text>
  </g>
</svg>