<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_hacker_news_launch_and_trend_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F0E05" /><stop offset="50%" stop-color="#3B1C0B" /><stop offset="100%" stop-color="#170A03" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_hacker_news_launch_and_trend_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.95" /><stop offset="50%" stop-color="#FF6600" stop-opacity="0.5" /><stop offset="100%" stop-color="#F97316" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_hacker_news_launch_and_trend_monitor" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#FF6600" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#FF6600" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FF6600" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_hacker_news_launch_and_trend_monitor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_hacker_news_launch_and_trend_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_hacker_news_launch_and_trend_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_hacker_news_launch_and_trend_monitor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_hacker_news_launch_and_trend_monitor)" stroke="url(#borderGrad_hacker_news_launch_and_trend_monitor)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_hacker_news_launch_and_trend_monitor)" />
  
        <g stroke="#10B981" stroke-opacity="0.08" stroke-width="1.5">
          <line x1="60" y1="120" x2="452" y2="120" stroke-dasharray="4 8" />
          <line x1="60" y1="180" x2="452" y2="180" />
          <line x1="60" y1="240" x2="452" y2="240" stroke-dasharray="6 6" />
          <line x1="60" y1="300" x2="452" y2="300" />
          <line x1="60" y1="360" x2="452" y2="360" stroke-dasharray="4 8" />
          <line x1="60" y1="420" x2="452" y2="420" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_hacker_news_launch_and_trend_monitor)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_hacker_news_launch_and_trend_monitor)">
    
    <!-- Y Combinator Official Orange Square -->
    <rect x="156" y="146" width="200" height="200" rx="28" fill="#FF6600" stroke="#FB923C" stroke-width="3" />
    <!-- Bold White 'Y' -->
    <polygon points="210,195 238,250 238,295 274,295 274,250 302,195 270,195 256,230 242,195" fill="#FFFFFF" />
    <!-- Rising Launch Rocket -->
    <g transform="translate(320, 290)">
      <polygon points="40,0 20,40 60,40" fill="#FBBF24" />
      <polygon points="20,40 40,70 60,40" fill="#EF4444" />
    </g>
    <!-- Frontpage Rank #1 Badge -->
    <rect x="146" y="372" width="220" height="36" rx="18" fill="#431407" stroke="#F97316" stroke-width="2" />
    <text x="256" y="395" font-family="sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">#1 ON FRONTPAGE</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_hacker_news_launch_and_trend_monitor)">
    <rect x="266" y="56" width="182" height="42" rx="21" fill="#431407" stroke="#F97316" stroke-width="2.2" />
    <circle cx="286" cy="77" r="5.5" fill="#FB923C" filter="url(#softGlow_hacker_news_launch_and_trend_monitor)" />
    <text x="366" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FFFBEB" letter-spacing="1.5">HN TRENDS</text>
  </g>
</svg>