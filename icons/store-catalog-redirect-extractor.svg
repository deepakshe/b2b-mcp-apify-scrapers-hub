<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_store_catalog_redirect_extractor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061A14" /><stop offset="50%" stop-color="#0B3826" /><stop offset="100%" stop-color="#041C13" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_store_catalog_redirect_extractor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95BF47" stop-opacity="0.95" /><stop offset="50%" stop-color="#10B981" stop-opacity="0.5" /><stop offset="100%" stop-color="#34D399" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_store_catalog_redirect_extractor" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_store_catalog_redirect_extractor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_store_catalog_redirect_extractor" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_store_catalog_redirect_extractor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_store_catalog_redirect_extractor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_store_catalog_redirect_extractor)" stroke="url(#borderGrad_store_catalog_redirect_extractor)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_store_catalog_redirect_extractor)" />
  
        <g stroke="#10B981" stroke-opacity="0.08" stroke-width="1.5">
          <line x1="60" y1="120" x2="452" y2="120" stroke-dasharray="4 8" />
          <line x1="60" y1="180" x2="452" y2="180" />
          <line x1="60" y1="240" x2="452" y2="240" stroke-dasharray="6 6" />
          <line x1="60" y1="300" x2="452" y2="300" />
          <line x1="60" y1="360" x2="452" y2="360" stroke-dasharray="4 8" />
          <line x1="60" y1="420" x2="452" y2="420" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_store_catalog_redirect_extractor)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_store_catalog_redirect_extractor)">
    
    <!-- 3D Shopify Shopping Bag -->
    <path d="M 215 178 C 215 125, 297 125, 297 178" fill="none" stroke="#374151" stroke-width="14" stroke-linecap="round" />
    <path d="M 215 178 C 215 128, 297 128, 297 178" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <!-- Trapezoidal Bag -->
    <path d="M 180 176 L 332 176 L 358 376 L 154 376 Z" fill="#95BF47" />
    <path d="M 154 376 L 180 176 L 192 176 L 170 376 Z" fill="#75A638" opacity="0.4" />
    <path d="M 332 176 L 358 376 L 344 376 L 320 176 Z" fill="#5E8E2D" opacity="0.5" />
    <polygon points="178,174 334,174 330,182 182,182" fill="#BBE87A" />
    <!-- Authentic White Shopify 'S' -->
    <g transform="translate(256, 280) scale(1.15)">
      <path d="M 16 -42 C 2 -40 -16 -32 -18 -12 C -20 10 -4 16 10 24 C 22 30 24 38 22 46 C 18 56 -2 58 -18 52 C -24 50 -26 46 -26 44 L -28 26 C -28 24 -24 24 -22 26 C -12 34 6 36 12 28 C 16 22 14 14 2 8 C -14 0 -24 -6 -24 -26 C -24 -46 -6 -56 16 -56 C 24 -56 30 -52 32 -50 L 26 -34 C 24 -36 22 -40 16 -42 Z" fill="#FFFFFF" />
      <path d="M 16 -42 C 2 -40 -16 -32 -18 -12 C -20 10 -4 16 10 24 C 22 30 24 38 22 46 C 18 56 -2 58 -18 52" fill="none" stroke="#5E8E2D" stroke-width="2" opacity="0.3" />
    </g>
    <circle cx="215" cy="184" r="6" fill="#1F2937" />
    <circle cx="297" cy="184" r="6" fill="#1F2937" />
    <!-- Dynamic 301 Orange Redirect Loop -->
    <path d="M 120 290 C 90 350, 150 420, 260 415 C 340 410, 395 365, 395 300 C 395 240, 345 210, 305 210" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round" />
    <path d="M 120 290 C 90 350, 150 420, 260 415 C 340 410, 395 365, 395 300 C 395 240, 345 210, 305 210" fill="none" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <polygon points="305,194 305,226 280,210" fill="#F59E0B" stroke="#FEF08A" stroke-width="2" />
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_store_catalog_redirect_extractor)">
    <rect x="234" y="56" width="214" height="42" rx="21" fill="#064E3B" stroke="#95BF47" stroke-width="2.2" />
    <circle cx="254" cy="77" r="5.5" fill="#10B981" filter="url(#softGlow_store_catalog_redirect_extractor)" />
    <text x="350" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#ECFDF5" letter-spacing="1.5">SHOPIFY 301</text>
  </g>
</svg>