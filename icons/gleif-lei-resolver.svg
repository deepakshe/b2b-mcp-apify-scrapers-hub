<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_gleif_lei_resolver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E24" /><stop offset="50%" stop-color="#141C48" /><stop offset="100%" stop-color="#080B1C" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_gleif_lei_resolver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" /><stop offset="50%" stop-color="#6366F1" stop-opacity="0.5" /><stop offset="100%" stop-color="#A855F7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_gleif_lei_resolver" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_gleif_lei_resolver" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_gleif_lei_resolver" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_gleif_lei_resolver" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_gleif_lei_resolver" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_gleif_lei_resolver)" stroke="url(#borderGrad_gleif_lei_resolver)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_gleif_lei_resolver)" />
  
        <g stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1.5">
          <line x1="60" y1="140" x2="452" y2="330" />
          <line x1="60" y1="200" x2="452" y2="390" />
          <line x1="60" y1="260" x2="452" y2="450" />
          <line x1="452" y1="140" x2="60" y2="330" />
          <line x1="452" y1="200" x2="60" y2="390" />
          <line x1="452" y1="260" x2="60" y2="450" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_gleif_lei_resolver)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_gleif_lei_resolver)">
    
    <!-- Corporate Hierarchy Org Tree -->
    <rect x="220" y="160" width="72" height="38" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2.5" />
    <text x="256" y="184" font-family="sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle">PARENT</text>
    <!-- Branch lines -->
    <line x1="256" y1="198" x2="256" y2="230" stroke="#38BDF8" stroke-width="3" />
    <line x1="176" y1="230" x2="336" y2="230" stroke="#38BDF8" stroke-width="3" />
    <line x1="176" y1="230" x2="176" y2="250" stroke="#38BDF8" stroke-width="3" />
    <line x1="336" y1="230" x2="336" y2="250" stroke="#38BDF8" stroke-width="3" />
    <!-- Subsidiaries -->
    <rect x="140" y="250" width="72" height="34" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <text x="176" y="272" font-family="sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" text-anchor="middle">SUB A</text>
    <rect x="300" y="250" width="72" height="34" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <text x="336" y="272" font-family="sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" text-anchor="middle">SUB B</text>
    <!-- 20-Digit LEI Barcode Badge -->
    <rect x="146" y="340" width="220" height="42" rx="10" fill="#0C2340" stroke="#38BDF8" stroke-width="2.5" />
    <text x="256" y="366" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">20-DIGIT LEI RESOLVER</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_gleif_lei_resolver)">
    <rect x="266" y="56" width="182" height="42" rx="21" fill="#1E1B4B" stroke="#6366F1" stroke-width="2.2" />
    <circle cx="286" cy="77" r="5.5" fill="#A855F7" filter="url(#softGlow_gleif_lei_resolver)" />
    <text x="366" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#F0F9FF" letter-spacing="1.5">GLEIF LEI</text>
  </g>
</svg>