<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_app_store_reviews_scraper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061528" /><stop offset="50%" stop-color="#0C2B52" /><stop offset="100%" stop-color="#040F1D" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_app_store_reviews_scraper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" /><stop offset="50%" stop-color="#007AFF" stop-opacity="0.5" /><stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_app_store_reviews_scraper" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#007AFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#007AFF" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_app_store_reviews_scraper" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_app_store_reviews_scraper" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_app_store_reviews_scraper" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_app_store_reviews_scraper" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_app_store_reviews_scraper)" stroke="url(#borderGrad_app_store_reviews_scraper)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_app_store_reviews_scraper)" />
  
        <g stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1.5">
          <line x1="60" y1="140" x2="452" y2="330" />
          <line x1="60" y1="200" x2="452" y2="390" />
          <line x1="60" y1="260" x2="452" y2="450" />
          <line x1="452" y1="140" x2="60" y2="330" />
          <line x1="452" y1="200" x2="60" y2="390" />
          <line x1="452" y1="260" x2="60" y2="450" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_app_store_reviews_scraper)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_app_store_reviews_scraper)">
    
    <!-- Apple App Store Official Icon Background -->
    <rect x="156" y="146" width="200" height="200" rx="44" fill="#007AFF" stroke="#60A5FA" stroke-width="3" />
    <!-- Apple 'A' Minimalist Drafting Tool Icon in White -->
    <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Pencil / Ruler Left Bar -->
      <line x1="200" y1="290" x2="256" y2="190" />
      <!-- Right Bar -->
      <line x1="312" y1="290" x2="256" y2="190" />
      <!-- Crossbar -->
      <line x1="190" y1="265" x2="322" y2="265" />
    </g>
    <!-- 5 Gold Review Stars -->
    <g fill="#F59E0B" stroke="#FEF08A" stroke-width="1.5" transform="translate(136, 360)">
      <polygon points="20,5 25,18 38,18 28,26 32,38 20,30 8,38 12,26 2,18 15,18" />
      <polygon points="65,5 70,18 83,18 73,26 77,38 65,30 53,38 57,26 47,18 60,18" />
      <polygon points="110,5 115,18 128,18 118,26 122,38 110,30 98,38 102,26 92,18 105,18" />
      <polygon points="155,5 160,18 173,18 163,26 167,38 155,30 143,38 147,26 137,18 150,18" />
      <polygon points="200,5 205,18 218,18 208,26 212,38 200,30 188,38 192,26 182,18 195,18" />
    </g>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_app_store_reviews_scraper)">
    <rect x="266" y="56" width="182" height="42" rx="21" fill="#0C2E59" stroke="#38BDF8" stroke-width="2.2" />
    <circle cx="286" cy="77" r="5.5" fill="#60A5FA" filter="url(#softGlow_app_store_reviews_scraper)" />
    <text x="366" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#F0F9FF" letter-spacing="1.5">APP STORE</text>
  </g>
</svg>