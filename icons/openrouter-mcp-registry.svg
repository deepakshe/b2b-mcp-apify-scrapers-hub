<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_openrouter_mcp_registry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0A1E" /><stop offset="50%" stop-color="#181438" /><stop offset="100%" stop-color="#251D56" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_openrouter_mcp_registry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" /><stop offset="50%" stop-color="#C084FC" stop-opacity="0.4" /><stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_openrouter_mcp_registry" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_openrouter_mcp_registry" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_openrouter_mcp_registry" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_openrouter_mcp_registry" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_openrouter_mcp_registry" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_openrouter_mcp_registry)" stroke="url(#borderGrad_openrouter_mcp_registry)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_openrouter_mcp_registry)" />
  
        <g stroke="#8B5CF6" stroke-opacity="0.14" fill="none" stroke-width="1.8">
          <path d="M 60 256 L 140 256 L 160 220 L 180 290 L 200 230 L 220 270 L 240 256 L 452 256" />
          <line x1="60" y1="170" x2="452" y2="170" stroke-opacity="0.07" stroke-dasharray="4 6" />
          <line x1="60" y1="340" x2="452" y2="340" stroke-opacity="0.07" stroke-dasharray="4 6" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_openrouter_mcp_registry)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_openrouter_mcp_registry)">
    
        <!-- Neural Brain Nexus Connecting LLM Protocols -->
        <circle cx="256" cy="235" r="48" fill="#2E1065" stroke="#A855F7" stroke-width="3.5" />
        <!-- 6 Orbital Connected LLM Nodes -->
        <circle cx="170" cy="170" r="16" fill="#4C1D95" stroke="#C084FC" stroke-width="2" />
        <circle cx="342" cy="170" r="16" fill="#4C1D95" stroke="#C084FC" stroke-width="2" />
        <circle cx="150" cy="250" r="16" fill="#4C1D95" stroke="#C084FC" stroke-width="2" />
        <circle cx="362" cy="250" r="16" fill="#4C1D95" stroke="#C084FC" stroke-width="2" />
        <circle cx="200" cy="320" r="16" fill="#4C1D95" stroke="#C084FC" stroke-width="2" />
        <circle cx="312" cy="320" r="16" fill="#4C1D95" stroke="#C084FC" stroke-width="2" />
        <!-- Nexus Links -->
        <line x1="256" y1="235" x2="170" y2="170" stroke="#8B5CF6" stroke-width="2.5" />
        <line x1="256" y1="235" x2="342" y2="170" stroke="#8B5CF6" stroke-width="2.5" />
        <line x1="256" y1="235" x2="150" y2="250" stroke="#8B5CF6" stroke-width="2.5" />
        <line x1="256" y1="235" x2="362" y2="250" stroke="#8B5CF6" stroke-width="2.5" />
        <line x1="256" y1="235" x2="200" y2="320" stroke="#8B5CF6" stroke-width="2.5" />
        <line x1="256" y1="235" x2="312" y2="320" stroke="#8B5CF6" stroke-width="2.5" />
        <circle cx="256" cy="235" r="15" fill="#C084FC" />
        
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_openrouter_mcp_registry)">
    <rect x="336" y="56" width="112" height="42" rx="21" fill="#2E1065" stroke="#8B5CF6" stroke-width="2.2" />
    <circle cx="356" cy="77" r="5.5" fill="#C084FC" filter="url(#softGlow_openrouter_mcp_registry)" />
    <text x="401" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FAF5FF" letter-spacing="1.5">MCP</text>
  </g>
</svg>