<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_openrouter_mcp_registry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120824" /><stop offset="50%" stop-color="#220F45" /><stop offset="100%" stop-color="#0C0519" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_openrouter_mcp_registry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.95" /><stop offset="50%" stop-color="#EC4899" stop-opacity="0.5" /><stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_openrouter_mcp_registry" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_openrouter_mcp_registry" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_openrouter_mcp_registry" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_openrouter_mcp_registry" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_openrouter_mcp_registry" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_openrouter_mcp_registry)" stroke="url(#borderGrad_openrouter_mcp_registry)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_openrouter_mcp_registry)" />
  
        <g stroke="#38BDF8" stroke-opacity="0.12" fill="#38BDF8" fill-opacity="0.25" stroke-width="1.5">
          <line x1="120" y1="160" x2="200" y2="130" /><circle cx="120" cy="160" r="3" />
          <line x1="200" y1="130" x2="310" y2="150" /><circle cx="200" cy="130" r="4" />
          <line x1="310" y1="150" x2="390" y2="190" /><circle cx="310" cy="150" r="3" />
          <line x1="120" y1="160" x2="160" y2="280" />
          <line x1="160" y1="280" x2="256" y2="350" /><circle cx="160" cy="280" r="4" />
          <line x1="256" y1="350" x2="370" y2="320" /><circle cx="256" cy="350" r="4" />
          <line x1="370" y1="320" x2="390" y2="190" /><circle cx="370" cy="320" r="3" /><circle cx="390" cy="190" r="4" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_openrouter_mcp_registry)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_openrouter_mcp_registry)">
    
    <!-- Neural Network Synapse Nodes & MCP Plug -->
    <g stroke="#C084FC" stroke-width="2.5">
      <line x1="190" y1="190" x2="256" y2="160" /><circle cx="190" cy="190" r="14" fill="#A855F7" />
      <line x1="322" y1="190" x2="256" y2="160" /><circle cx="322" cy="190" r="14" fill="#A855F7" />
      <line x1="256" y1="160" x2="256" y2="240" /><circle cx="256" cy="160" r="18" fill="#EC4899" />
      <line x1="190" y1="190" x2="256" y2="240" />
      <line x1="322" y1="190" x2="256" y2="240" />
    </g>
    <!-- MCP Interface Connector -->
    <rect x="200" y="270" width="112" height="50" rx="12" fill="#1E1B4B" stroke="#38BDF8" stroke-width="3" />
    <rect x="225" y="285" width="14" height="20" rx="3" fill="#38BDF8" />
    <rect x="250" y="285" width="14" height="20" rx="3" fill="#38BDF8" />
    <rect x="275" y="285" width="14" height="20" rx="3" fill="#38BDF8" />
    <!-- OpenRouter Registry Pill -->
    <rect x="146" y="356" width="220" height="36" rx="18" fill="#2E1065" stroke="#C084FC" stroke-width="2" />
    <text x="256" y="379" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">MODEL CONTEXT PROTOCOL</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_openrouter_mcp_registry)">
    <rect x="250" y="56" width="198" height="42" rx="21" fill="#2E1065" stroke="#C084FC" stroke-width="2.2" />
    <circle cx="270" cy="77" r="5.5" fill="#EC4899" filter="url(#softGlow_openrouter_mcp_registry)" />
    <text x="358" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FAF5FF" letter-spacing="1.5">OPENROUTER</text>
  </g>
</svg>