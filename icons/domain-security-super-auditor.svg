<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_domain_security_super_auditor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05100B" /><stop offset="50%" stop-color="#0B2418" /><stop offset="100%" stop-color="#030C08" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_domain_security_super_auditor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.95" /><stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5" /><stop offset="100%" stop-color="#34D399" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_domain_security_super_auditor" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_domain_security_super_auditor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_domain_security_super_auditor" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_domain_security_super_auditor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_domain_security_super_auditor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_domain_security_super_auditor)" stroke="url(#borderGrad_domain_security_super_auditor)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_domain_security_super_auditor)" />
  
        <g stroke="#10B981" stroke-opacity="0.14" fill="none" stroke-width="2" stroke-linecap="round">
          <path d="M 80 180 L 140 180 L 170 210 L 170 270" /><circle cx="80" cy="180" r="4" fill="#10B981" />
          <path d="M 432 180 L 372 180 L 342 210 L 342 260" /><circle cx="432" cy="180" r="4" fill="#10B981" />
          <path d="M 120 380 L 180 380 L 210 350 L 210 310" /><circle cx="120" cy="380" r="4" fill="#10B981" />
          <path d="M 392 380 L 332 380 L 302 350 L 302 310" /><circle cx="392" cy="380" r="4" fill="#10B981" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_domain_security_super_auditor)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_domain_security_super_auditor)">
    
    <!-- Heavy 3D Golden Padlock & Emerald Armor Shield -->
    <path d="M 256 140 Q 320 140 320 190 Q 320 290 256 340 Q 192 290 192 190 Q 192 140 256 140 Z" fill="#022C22" stroke="#10B981" stroke-width="4" />
    <!-- Golden Padlock -->
    <rect x="220" y="220" width="72" height="60" rx="12" fill="#D97706" stroke="#FEF08A" stroke-width="3" />
    <path d="M 235 220 L 235 195 C 235 175, 277 175, 277 195 L 277 220" fill="none" stroke="#FEF08A" stroke-width="6" />
    <circle cx="256" cy="245" r="6" fill="#FFFFFF" />
    <line x1="256" y1="251" x2="256" y2="265" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <!-- Audit Compliance Pill -->
    <rect x="146" y="360" width="220" height="34" rx="17" fill="#064E3B" stroke="#10B981" stroke-width="2" />
    <text x="256" y="382" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">HSTS • DMARC • TLS 1.3</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_domain_security_super_auditor)">
    <rect x="266" y="56" width="182" height="42" rx="21" fill="#022C22" stroke="#10B981" stroke-width="2.2" />
    <circle cx="286" cy="77" r="5.5" fill="#34D399" filter="url(#softGlow_domain_security_super_auditor)" />
    <text x="366" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#ECFDF5" letter-spacing="1.5">SSL / TLS</text>
  </g>
</svg>