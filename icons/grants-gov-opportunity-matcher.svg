<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_grants_gov_opportunity_matcher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101E" /><stop offset="50%" stop-color="#101D36" /><stop offset="100%" stop-color="#060C17" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_grants_gov_opportunity_matcher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.95" /><stop offset="50%" stop-color="#EF4444" stop-opacity="0.5" /><stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_grants_gov_opportunity_matcher" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_grants_gov_opportunity_matcher" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_grants_gov_opportunity_matcher" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_grants_gov_opportunity_matcher" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_grants_gov_opportunity_matcher" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_grants_gov_opportunity_matcher)" stroke="url(#borderGrad_grants_gov_opportunity_matcher)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_grants_gov_opportunity_matcher)" />
  
        <g stroke="#F59E0B" stroke-opacity="0.12" fill="none" stroke-width="1.5">
          <circle cx="256" cy="256" r="90" />
          <circle cx="256" cy="256" r="140" stroke-dasharray="6 6" />
          <circle cx="256" cy="256" r="190" />
          <line x1="256" y1="60" x2="256" y2="452" stroke-opacity="0.08" />
          <line x1="60" y1="256" x2="452" y2="256" stroke-opacity="0.08" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_grants_gov_opportunity_matcher)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_grants_gov_opportunity_matcher)">
    
    <!-- Federal Grant Certificate with Gold Seal -->
    <rect x="160" y="150" width="192" height="160" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="3" />
    <rect x="180" y="175" width="152" height="12" rx="6" fill="#F59E0B" opacity="0.8" />
    <rect x="180" y="200" width="100" height="10" rx="5" fill="#94A3B8" />
    <rect x="180" y="220" width="120" height="10" rx="5" fill="#94A3B8" />
    <!-- Gold Wax Ribbon Seal -->
    <circle cx="256" cy="275" r="24" fill="#D97706" stroke="#FEF08A" stroke-width="3" />
    <polygon points="256,260 263,275 278,275 266,285 270,300 256,290 242,300 246,285 234,275 249,275" fill="#FFFFFF" />
    <!-- Grant Opportunity Matching Pill -->
    <rect x="146" y="356" width="220" height="36" rx="18" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
    <text x="256" y="379" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">FEDERAL GRANTS</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_grants_gov_opportunity_matcher)">
    <rect x="250" y="56" width="198" height="42" rx="21" fill="#1E293B" stroke="#F59E0B" stroke-width="2.2" />
    <circle cx="270" cy="77" r="5.5" fill="#FBBF24" filter="url(#softGlow_grants_gov_opportunity_matcher)" />
    <text x="358" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FEF3C7" letter-spacing="1.5">GRANTS.GOV</text>
  </g>
</svg>