<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_pypi_package_health_auditor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A131F" /><stop offset="50%" stop-color="#13253A" /><stop offset="100%" stop-color="#070E18" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_pypi_package_health_auditor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3775A9" stop-opacity="0.95" /><stop offset="50%" stop-color="#FFD43B" stop-opacity="0.6" /><stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_pypi_package_health_auditor" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#3775A9" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#3775A9" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3775A9" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_pypi_package_health_auditor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_pypi_package_health_auditor" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_pypi_package_health_auditor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_pypi_package_health_auditor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_pypi_package_health_auditor)" stroke="url(#borderGrad_pypi_package_health_auditor)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_pypi_package_health_auditor)" />
  
        <g stroke="#10B981" stroke-opacity="0.14" fill="none" stroke-width="2" stroke-linecap="round">
          <path d="M 80 180 L 140 180 L 170 210 L 170 270" /><circle cx="80" cy="180" r="4" fill="#10B981" />
          <path d="M 432 180 L 372 180 L 342 210 L 342 260" /><circle cx="432" cy="180" r="4" fill="#10B981" />
          <path d="M 120 380 L 180 380 L 210 350 L 210 310" /><circle cx="120" cy="380" r="4" fill="#10B981" />
          <path d="M 392 380 L 332 380 L 302 350 L 302 310" /><circle cx="392" cy="380" r="4" fill="#10B981" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_pypi_package_health_auditor)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_pypi_package_health_auditor)">
    
    <!-- Python Official Blue & Yellow Snakes -->
    <g transform="translate(256, 230) scale(1.1)">
      <!-- Blue Snake (Top Left) -->
      <path d="M -10 -70 C -45 -70, -60 -55, -60 -30 L -60 -10 L -10 -10 L -10 0 L -45 0 C -65 0, -80 15, -80 40 C -80 65, -65 80, -45 80 L -30 80 L -30 65 C -30 45, -15 30, 5 30 L 25 30 L 25 -20 C 25 -45, 10 -70, -10 -70 Z M -35 -55 C -30 -55, -25 -50, -25 -45 C -25 -40, -30 -35, -35 -35 C -40 -35, -45 -40, -45 -45 C -45 -50, -40 -55, -35 -55 Z" fill="#3775A9" />
      <!-- Yellow Snake (Bottom Right) -->
      <path d="M 10 70 C 45 70, 60 55, 60 30 L 60 10 L 10 10 L 10 0 L 45 0 C 65 0, 80 -15, 80 -40 C 80 -65, 65 -80, 45 -80 L 30 -80 L 30 -65 C 30 -45, 15 -30, -5 -30 L -25 -30 L -25 20 C -25 45, -10 70, 10 70 Z M 35 55 C 30 55, 25 50, 25 45 C 25 40, 30 35, 35 35 C 40 35, 45 40, 45 45 C 45 50, 40 55, 35 55 Z" fill="#FFD43B" />
    </g>
    <!-- Security Shield -->
    <rect x="156" y="360" width="200" height="34" rx="17" fill="#1E293B" stroke="#FFD43B" stroke-width="2" />
    <text x="256" y="382" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">CVE AUDIT PASS</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_pypi_package_health_auditor)">
    <rect x="250" y="56" width="198" height="42" rx="21" fill="#1E293B" stroke="#FFD43B" stroke-width="2.2" />
    <circle cx="270" cy="77" r="5.5" fill="#3775A9" filter="url(#softGlow_pypi_package_health_auditor)" />
    <text x="358" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FFFFFF" letter-spacing="1.5">PYPI AUDIT</text>
  </g>
</svg>