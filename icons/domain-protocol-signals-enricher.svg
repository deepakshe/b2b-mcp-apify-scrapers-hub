<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_domain_protocol_signals_enricher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121E" /><stop offset="50%" stop-color="#0D2238" /><stop offset="100%" stop-color="#040D17" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_domain_protocol_signals_enricher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" /><stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.5" /><stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_domain_protocol_signals_enricher" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#0EA5E9" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_domain_protocol_signals_enricher" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_domain_protocol_signals_enricher" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_domain_protocol_signals_enricher" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_domain_protocol_signals_enricher" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_domain_protocol_signals_enricher)" stroke="url(#borderGrad_domain_protocol_signals_enricher)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_domain_protocol_signals_enricher)" />
  
        <g stroke="#8B5CF6" stroke-opacity="0.14" fill="none" stroke-width="1.8">
          <path d="M 60 256 L 140 256 L 160 220 L 180 290 L 200 230 L 220 270 L 240 256 L 452 256" />
          <line x1="60" y1="170" x2="452" y2="170" stroke-opacity="0.07" stroke-dasharray="4 6" />
          <line x1="60" y1="340" x2="452" y2="340" stroke-opacity="0.07" stroke-dasharray="4 6" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_domain_protocol_signals_enricher)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_domain_protocol_signals_enricher)">
    
    <!-- Smartphone Broadcasting Deep Link Protocols -->
    <rect x="186" y="140" width="140" height="230" rx="26" fill="#0F172A" stroke="#38BDF8" stroke-width="3.5" />
    <circle cx="256" cy="180" r="20" fill="#0284C7" />
    <!-- Radio Transmission Antenna Signal Waves -->
    <path d="M 220 230 C 230 220, 280 220, 290 230" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
    <path d="M 205 250 C 225 235, 285 235, 305 250" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
    <path d="M 190 270 C 220 250, 290 250, 320 270" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
    <!-- .well-known Badge -->
    <rect x="136" y="356" width="240" height="36" rx="18" fill="#0C2340" stroke="#38BDF8" stroke-width="2" />
    <text x="256" y="379" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">.WELL-KNOWN ASSETLINKS</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_domain_protocol_signals_enricher)">
    <rect x="266" y="56" width="182" height="42" rx="21" fill="#082F49" stroke="#0EA5E9" stroke-width="2.2" />
    <circle cx="286" cy="77" r="5.5" fill="#38BDF8" filter="url(#softGlow_domain_protocol_signals_enricher)" />
    <text x="366" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#F0F9FF" letter-spacing="1.5">APP LINKS</text>
  </g>
</svg>