<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_local_business_website_phone_whatsapp_scraper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061A14" /><stop offset="50%" stop-color="#0B3026" /><stop offset="100%" stop-color="#03120E" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_local_business_website_phone_whatsapp_scraper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.95" /><stop offset="50%" stop-color="#128C7E" stop-opacity="0.5" /><stop offset="100%" stop-color="#4ADE80" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_local_business_website_phone_whatsapp_scraper" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#25D366" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#25D366" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#25D366" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_local_business_website_phone_whatsapp_scraper" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_local_business_website_phone_whatsapp_scraper" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_local_business_website_phone_whatsapp_scraper" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_local_business_website_phone_whatsapp_scraper" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_local_business_website_phone_whatsapp_scraper)" stroke="url(#borderGrad_local_business_website_phone_whatsapp_scraper)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_local_business_website_phone_whatsapp_scraper)" />
  
        <g stroke="#F43F5E" stroke-opacity="0.12" fill="none" stroke-width="2">
          <circle cx="256" cy="256" r="80" stroke-dasharray="8 6" />
          <circle cx="256" cy="256" r="130" stroke-dasharray="12 8" />
          <circle cx="256" cy="256" r="180" stroke-dasharray="16 10" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_local_business_website_phone_whatsapp_scraper)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_local_business_website_phone_whatsapp_scraper)">
    
    <!-- WhatsApp 3D Chat Bubble -->
    <circle cx="256" cy="246" r="95" fill="#25D366" stroke="#4ADE80" stroke-width="3" />
    <path d="M 195 315 L 165 355 L 225 338 Z" fill="#128C7E" />
    <!-- White Telephone Handset -->
    <path d="M 220 195 C 215 190, 205 190, 200 195 L 188 207 C 182 213, 180 222, 184 230 C 196 258, 222 284, 250 296 C 258 300, 267 298, 273 292 L 285 280 C 290 275, 290 265, 285 260 L 265 240 C 260 235, 250 235, 245 240 L 238 247 C 230 242, 224 236, 219 228 L 226 221 C 231 216, 231 206, 226 201 Z" fill="#FFFFFF" />
    <!-- Store Awning + Lead Pill -->
    <rect x="156" y="370" width="200" height="36" rx="18" fill="#064E3B" stroke="#25D366" stroke-width="2.5" />
    <text x="256" y="393" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">PHONE + WHATSAPP</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_local_business_website_phone_whatsapp_scraper)">
    <rect x="282" y="56" width="166" height="42" rx="21" fill="#064E3B" stroke="#25D366" stroke-width="2.2" />
    <circle cx="302" cy="77" r="5.5" fill="#4ADE80" filter="url(#softGlow_local_business_website_phone_whatsapp_scraper)" />
    <text x="374" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#ECFDF5" letter-spacing="1.5">WHATSAPP</text>
  </g>
</svg>