<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_local_business_website_phone_whatsapp_scraper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A" /><stop offset="50%" stop-color="#151C3B" /><stop offset="100%" stop-color="#1E295A" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_local_business_website_phone_whatsapp_scraper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" /><stop offset="50%" stop-color="#818CF8" stop-opacity="0.4" /><stop offset="100%" stop-color="#C084FC" stop-opacity="0.7" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_local_business_website_phone_whatsapp_scraper" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_local_business_website_phone_whatsapp_scraper" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_local_business_website_phone_whatsapp_scraper" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_local_business_website_phone_whatsapp_scraper" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_local_business_website_phone_whatsapp_scraper" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_local_business_website_phone_whatsapp_scraper)" stroke="url(#borderGrad_local_business_website_phone_whatsapp_scraper)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_local_business_website_phone_whatsapp_scraper)" />
  
        <g stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1.5">
          <line x1="60" y1="140" x2="452" y2="330" />
          <line x1="60" y1="200" x2="452" y2="390" />
          <line x1="60" y1="260" x2="452" y2="450" />
          <line x1="452" y1="140" x2="60" y2="330" />
          <line x1="452" y1="200" x2="60" y2="390" />
          <line x1="452" y1="260" x2="60" y2="450" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_local_business_website_phone_whatsapp_scraper)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_local_business_website_phone_whatsapp_scraper)">
    
        <!-- Storefront Awning & WhatsApp Beacon -->
        <path d="M 140 220 L 372 220 L 360 260 L 152 260 Z" fill="#1E293B" stroke="#22C55E" stroke-width="3" />
        <path d="M 140 220 L 175 260 L 210 220 L 256 260 L 302 220 L 337 260 L 372 220" fill="none" stroke="#4ADE80" stroke-width="3" />
        <!-- Store Glass Base -->
        <rect x="160" y="260" width="192" height="100" fill="#0B131F" stroke="#22C55E" stroke-width="2.5" />
        <!-- Glowing WhatsApp Bubble -->
        <circle cx="295" cy="180" r="38" fill="#15803D" stroke="#4ADE80" stroke-width="2.5" />
        <path d="M 282 170 C 275 178, 275 188, 282 195 C 288 201, 298 201, 305 194" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
        <circle cx="215" cy="180" r="28" fill="#0369A1" stroke="#38BDF8" stroke-width="2" />
        <text x="215" y="186" font-family="sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle">TEL</text>
        
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_local_business_website_phone_whatsapp_scraper)">
    <rect x="336" y="56" width="112" height="42" rx="21" fill="#082F49" stroke="#0EA5E9" stroke-width="2.2" />
    <circle cx="356" cy="77" r="5.5" fill="#38BDF8" filter="url(#softGlow_local_business_website_phone_whatsapp_scraper)" />
    <text x="401" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#F0F9FF" letter-spacing="1.5">WA</text>
  </g>
</svg>