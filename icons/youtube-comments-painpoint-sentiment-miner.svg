<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_youtube_comments_painpoint_sentiment_miner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A070B" /><stop offset="50%" stop-color="#3F0C14" /><stop offset="100%" stop-color="#68101E" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_youtube_comments_painpoint_sentiment_miner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8" /><stop offset="50%" stop-color="#FB7185" stop-opacity="0.4" /><stop offset="100%" stop-color="#FBBF24" stop-opacity="0.7" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_youtube_comments_painpoint_sentiment_miner" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#E11D48" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_youtube_comments_painpoint_sentiment_miner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_youtube_comments_painpoint_sentiment_miner" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_youtube_comments_painpoint_sentiment_miner" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_youtube_comments_painpoint_sentiment_miner" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_youtube_comments_painpoint_sentiment_miner)" stroke="url(#borderGrad_youtube_comments_painpoint_sentiment_miner)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_youtube_comments_painpoint_sentiment_miner)" />
  
        <g stroke="#F43F5E" stroke-opacity="0.12" fill="none" stroke-width="2">
          <circle cx="256" cy="256" r="80" stroke-dasharray="8 6" />
          <circle cx="256" cy="256" r="130" stroke-dasharray="12 8" />
          <circle cx="256" cy="256" r="180" stroke-dasharray="16 10" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_youtube_comments_painpoint_sentiment_miner)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_youtube_comments_painpoint_sentiment_miner)">
    
        <!-- 3D Conversation Bubbles & Sentiment Graph -->
        <rect x="130" y="160" width="180" height="110" rx="24" fill="#3B0712" stroke="#F43F5E" stroke-width="3" />
        <polygon points="160,270 180,270 160,295" fill="#3B0712" />
        <!-- Mini Comment Lines -->
        <rect x="155" y="190" width="120" height="8" rx="4" fill="#FDA4AF" />
        <rect x="155" y="210" width="85" height="8" rx="4" fill="#FECDD3" />
        <!-- Sentiment Radar Gauge Bubble -->
        <circle cx="310" cy="270" r="50" fill="#1C1917" stroke="#F59E0B" stroke-width="3" />
        <path d="M 280 270 Q 310 240 340 270" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round" />
        <circle cx="295" cy="285" r="5" fill="#EF4444" />
        <circle cx="310" cy="260" r="6" fill="#10B981" />
        <circle cx="325" cy="280" r="5" fill="#F59E0B" />
        
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_youtube_comments_painpoint_sentiment_miner)">
    <rect x="336" y="56" width="112" height="42" rx="21" fill="#450A0A" stroke="#F59E0B" stroke-width="2.2" />
    <circle cx="356" cy="77" r="5.5" fill="#FBBF24" filter="url(#softGlow_youtube_comments_painpoint_sentiment_miner)" />
    <text x="401" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FFFBEB" letter-spacing="1.5">SENT</text>
  </g>
</svg>