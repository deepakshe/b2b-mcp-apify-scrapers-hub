<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_youtube_comments_painpoint_sentiment_miner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F0407" /><stop offset="50%" stop-color="#3B080E" /><stop offset="100%" stop-color="#140204" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_youtube_comments_painpoint_sentiment_miner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" stop-opacity="0.95" /><stop offset="50%" stop-color="#FF0000" stop-opacity="0.5" /><stop offset="100%" stop-color="#B30000" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_youtube_comments_painpoint_sentiment_miner" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#FF0000" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FF0000" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_youtube_comments_painpoint_sentiment_miner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_youtube_comments_painpoint_sentiment_miner" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_youtube_comments_painpoint_sentiment_miner" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_youtube_comments_painpoint_sentiment_miner" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_youtube_comments_painpoint_sentiment_miner)" stroke="url(#borderGrad_youtube_comments_painpoint_sentiment_miner)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_youtube_comments_painpoint_sentiment_miner)" />
  
        <g stroke="#F43F5E" stroke-opacity="0.12" fill="none" stroke-width="2">
          <circle cx="256" cy="256" r="80" stroke-dasharray="8 6" />
          <circle cx="256" cy="256" r="130" stroke-dasharray="12 8" />
          <circle cx="256" cy="256" r="180" stroke-dasharray="16 10" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_youtube_comments_painpoint_sentiment_miner)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_youtube_comments_painpoint_sentiment_miner)">
    
    <!-- YouTube Red Button -->
    <g transform="translate(0, -20)">
      <rect x="156" y="150" width="200" height="140" rx="36" fill="#FF0000" />
      <polygon points="236,192 236,248 286,220" fill="#FFFFFF" />
    </g>
    <!-- 3D Glowing Comment Bubble -->
    <path d="M 170 290 L 342 290 C 360 290, 374 304, 374 322 L 374 372 C 374 390, 360 404, 342 404 L 230 404 L 180 430 L 195 404 L 170 404 C 152 404, 138 390, 138 372 L 138 322 C 138 304, 152 290, 170 290 Z" fill="#1E293B" stroke="#38BDF8" stroke-width="3" />
    <!-- Sentiment Heatmap Dots -->
    <circle cx="180" cy="350" r="14" fill="#10B981" /><text x="180" y="355" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">+</text>
    <circle cx="256" cy="350" r="14" fill="#F59E0B" /><text x="256" y="355" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">~</text>
    <circle cx="332" cy="350" r="14" fill="#EF4444" /><text x="332" y="355" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">-</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_youtube_comments_painpoint_sentiment_miner)">
    <rect x="282" y="56" width="166" height="42" rx="21" fill="#450A0A" stroke="#EF4444" stroke-width="2.2" />
    <circle cx="302" cy="77" r="5.5" fill="#F87171" filter="url(#softGlow_youtube_comments_painpoint_sentiment_miner)" />
    <text x="374" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FFFBEB" letter-spacing="1.5">YT MINER</text>
  </g>
</svg>