<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_cpsc_recall_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#170912" /><stop offset="50%" stop-color="#2E1024" /><stop offset="100%" stop-color="#4C1337" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_cpsc_recall_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE123C" stop-opacity="0.8" /><stop offset="50%" stop-color="#FB7185" stop-opacity="0.4" /><stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.7" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_cpsc_recall_monitor" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#9F1239" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#9F1239" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#9F1239" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_cpsc_recall_monitor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_cpsc_recall_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_cpsc_recall_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_cpsc_recall_monitor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_cpsc_recall_monitor)" stroke="url(#borderGrad_cpsc_recall_monitor)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_cpsc_recall_monitor)" />
  
        <g stroke="#BE123C" stroke-opacity="0.12" fill="none" stroke-width="1.5">
          <polygon points="256,120 286,137 286,172 256,189 226,172 226,137" />
          <polygon points="196,155 226,172 226,207 196,224 166,207 166,172" />
          <polygon points="316,155 346,172 346,207 316,224 286,207 286,172" />
          <polygon points="256,224 286,241 286,276 256,293 226,276 226,241" />
          <polygon points="196,259 226,276 226,311 196,328 166,311 166,276" />
          <polygon points="316,259 346,276 346,311 316,328 286,311 286,276" />
          <polygon points="256,328 286,345 286,380 256,397 226,380 226,345" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_cpsc_recall_monitor)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_cpsc_recall_monitor)">
    
        <!-- Warning Safety Hazard Triangle with Recall Scanner -->
        <polygon points="256,150 356,310 156,310" fill="#4C0519" stroke="#E11D48" stroke-width="4" stroke-linejoin="round" />
        <rect x="251" y="210" width="10" height="50" rx="5" fill="#FBBF24" />
        <circle cx="256" cy="280" r="6" fill="#FBBF24" />
        <!-- Magnifying Glass Scanner -->
        <circle cx="310" cy="280" r="26" fill="none" stroke="#F43F5E" stroke-width="3.5" />
        <line x1="330" y1="300" x2="350" y2="320" stroke="#F43F5E" stroke-width="4.5" stroke-linecap="round" />
        
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_cpsc_recall_monitor)">
    <rect x="336" y="56" width="112" height="42" rx="21" fill="#4C0519" stroke="#E11D48" stroke-width="2.2" />
    <circle cx="356" cy="77" r="5.5" fill="#FDA4AF" filter="url(#softGlow_cpsc_recall_monitor)" />
    <text x="401" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FFF1F2" letter-spacing="1.5">CPSC</text>
  </g>
</svg>