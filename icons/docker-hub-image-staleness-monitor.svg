<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_docker_hub_image_staleness_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0A1E" /><stop offset="50%" stop-color="#181438" /><stop offset="100%" stop-color="#251D56" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_docker_hub_image_staleness_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8" /><stop offset="50%" stop-color="#C084FC" stop-opacity="0.4" /><stop offset="100%" stop-color="#38BDF8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_docker_hub_image_staleness_monitor" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_docker_hub_image_staleness_monitor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_docker_hub_image_staleness_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_docker_hub_image_staleness_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_docker_hub_image_staleness_monitor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_docker_hub_image_staleness_monitor)" stroke="url(#borderGrad_docker_hub_image_staleness_monitor)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_docker_hub_image_staleness_monitor)" />
  
        <g stroke="#8B5CF6" stroke-opacity="0.14" fill="none" stroke-width="1.8">
          <path d="M 60 256 L 140 256 L 160 220 L 180 290 L 200 230 L 220 270 L 240 256 L 452 256" />
          <line x1="60" y1="170" x2="452" y2="170" stroke-opacity="0.07" stroke-dasharray="4 6" />
          <line x1="60" y1="340" x2="452" y2="340" stroke-opacity="0.07" stroke-dasharray="4 6" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_docker_hub_image_staleness_monitor)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_docker_hub_image_staleness_monitor)">
    
        <!-- 3D Shipping Container on Whale Deck with Age Stamp -->
        <path d="M 150 250 Q 200 290 360 270 Q 370 250 350 240 L 150 240 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="3" />
        <!-- Container Grid On Top -->
        <g fill="#0369A1" stroke="#38BDF8" stroke-width="2">
          <rect x="180" y="195" width="35" height="35" rx="4" />
          <rect x="225" y="195" width="35" height="35" rx="4" />
          <rect x="270" y="195" width="35" height="35" rx="4" />
          <rect x="225" y="152" width="35" height="35" rx="4" />
          <rect x="270" y="152" width="35" height="35" rx="4" />
        </g>
        <!-- Whale Eye -->
        <circle cx="340" cy="255" r="4" fill="#FFFFFF" />
        
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_docker_hub_image_staleness_monitor)">
    <rect x="314" y="56" width="134" height="42" rx="21" fill="#2E1065" stroke="#8B5CF6" stroke-width="2.2" />
    <circle cx="334" cy="77" r="5.5" fill="#C084FC" filter="url(#softGlow_docker_hub_image_staleness_monitor)" />
    <text x="390" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FAF5FF" letter-spacing="1.5">DOCKER</text>
  </g>
</svg>