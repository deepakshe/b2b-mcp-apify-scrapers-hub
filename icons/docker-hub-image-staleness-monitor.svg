<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_docker_hub_image_staleness_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06182C" /><stop offset="50%" stop-color="#0A2E54" /><stop offset="100%" stop-color="#041324" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_docker_hub_image_staleness_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" /><stop offset="50%" stop-color="#1D63ED" stop-opacity="0.5" /><stop offset="100%" stop-color="#0DB7ED" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_docker_hub_image_staleness_monitor" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#1D63ED" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#1D63ED" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#1D63ED" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_docker_hub_image_staleness_monitor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_docker_hub_image_staleness_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_docker_hub_image_staleness_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_docker_hub_image_staleness_monitor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_docker_hub_image_staleness_monitor)" stroke="url(#borderGrad_docker_hub_image_staleness_monitor)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_docker_hub_image_staleness_monitor)" />
  
        <g stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1.5">
          <line x1="60" y1="140" x2="452" y2="330" />
          <line x1="60" y1="200" x2="452" y2="390" />
          <line x1="60" y1="260" x2="452" y2="450" />
          <line x1="452" y1="140" x2="60" y2="330" />
          <line x1="452" y1="200" x2="60" y2="390" />
          <line x1="452" y1="260" x2="60" y2="450" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_docker_hub_image_staleness_monitor)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_docker_hub_image_staleness_monitor)">
    
    <!-- Docker Whale and Containers -->
    <g transform="translate(256, 260)">
      <!-- Containers on Whale Back -->
      <g fill="#0DB7ED" stroke="#FFFFFF" stroke-width="2">
        <rect x="-60" y="-80" width="24" height="20" rx="3" />
        <rect x="-32" y="-80" width="24" height="20" rx="3" />
        <rect x="-4" y="-80" width="24" height="20" rx="3" />
        <rect x="-60" y="-56" width="24" height="20" rx="3" />
        <rect x="-32" y="-56" width="24" height="20" rx="3" />
        <rect x="-4" y="-56" width="24" height="20" rx="3" />
        <rect x="24" y="-56" width="24" height="20" rx="3" />
        <rect x="-60" y="-32" width="24" height="20" rx="3" />
        <rect x="-32" y="-32" width="24" height="20" rx="3" />
        <rect x="-4" y="-32" width="24" height="20" rx="3" />
        <rect x="24" y="-32" width="24" height="20" rx="3" />
        <rect x="52" y="-32" width="24" height="20" rx="3" />
      </g>
      <!-- Whale Body -->
      <path d="M -110 -10 C -90 -10, -70 20, 0 20 C 70 20, 110 -10, 110 -10 C 110 30, 70 60, 0 60 C -70 60, -110 30, -110 -10 Z" fill="#1D63ED" />
      <!-- Whale Tail -->
      <path d="M -110 -10 C -125 -25, -140 -20, -145 0 C -135 15, -120 10, -110 -10 Z" fill="#1D63ED" />
      <!-- Eye -->
      <circle cx="70" cy="15" r="5" fill="#FFFFFF" />
    </g>
    <!-- Digest Verification Badge -->
    <rect x="146" y="370" width="220" height="34" rx="17" fill="#0C2B4D" stroke="#38BDF8" stroke-width="2" />
    <text x="256" y="392" font-family="sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">SHA256 DIGEST VERIFIED</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_docker_hub_image_staleness_monitor)">
    <rect x="250" y="56" width="198" height="42" rx="21" fill="#0C2B4D" stroke="#38BDF8" stroke-width="2.2" />
    <circle cx="270" cy="77" r="5.5" fill="#0DB7ED" filter="url(#softGlow_docker_hub_image_staleness_monitor)" />
    <text x="358" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#F0F9FF" letter-spacing="1.5">DOCKER HUB</text>
  </g>
</svg>