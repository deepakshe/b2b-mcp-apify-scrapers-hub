<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_google_ads_transparency" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1315" /><stop offset="50%" stop-color="#132426" /><stop offset="100%" stop-color="#1A3D3B" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_google_ads_transparency" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" /><stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4" /><stop offset="100%" stop-color="#34D399" stop-opacity="0.7" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_google_ads_transparency" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#10B981" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_google_ads_transparency" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_google_ads_transparency" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_google_ads_transparency" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_google_ads_transparency" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_google_ads_transparency)" stroke="url(#borderGrad_google_ads_transparency)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_google_ads_transparency)" />
  
        <g stroke="#10B981" stroke-opacity="0.08" stroke-width="1.5">
          <line x1="60" y1="120" x2="452" y2="120" stroke-dasharray="4 8" />
          <line x1="60" y1="180" x2="452" y2="180" />
          <line x1="60" y1="240" x2="452" y2="240" stroke-dasharray="6 6" />
          <line x1="60" y1="300" x2="452" y2="300" />
          <line x1="60" y1="360" x2="452" y2="360" stroke-dasharray="4 8" />
          <line x1="60" y1="420" x2="452" y2="420" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_google_ads_transparency)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_google_ads_transparency)">
    
        <!-- 3D Billboard Creative Screen & Analytics -->
        <polygon points="156,160 356,160 336,270 176,270" fill="#0F172A" stroke="#F59E0B" stroke-width="3" />
        <rect x="180" y="180" width="152" height="65" fill="#1E293B" />
        <polygon points="210,195 240,230 200,230" fill="#10B981" />
        <circle cx="270" cy="205" r="10" fill="#F59E0B" />
        <!-- Billboard Stand & Bar Chart -->
        <line x1="256" y1="270" x2="256" y2="340" stroke="#F59E0B" stroke-width="5" />
        <line x1="210" y1="340" x2="302" y2="340" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
        
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_google_ads_transparency)">
    <rect x="336" y="56" width="112" height="42" rx="21" fill="#064E3B" stroke="#10B981" stroke-width="2.2" />
    <circle cx="356" cy="77" r="5.5" fill="#34D399" filter="url(#softGlow_google_ads_transparency)" />
    <text x="401" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#ECFDF5" letter-spacing="1.5">ADS</text>
  </g>
</svg>