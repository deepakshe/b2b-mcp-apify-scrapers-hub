<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_package_dependency_graph_enricher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117" /><stop offset="50%" stop-color="#161B22" /><stop offset="100%" stop-color="#090D12" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_package_dependency_graph_enricher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.95" /><stop offset="50%" stop-color="#EA4335" stop-opacity="0.6" /><stop offset="100%" stop-color="#34A853" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_package_dependency_graph_enricher" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#4285F4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_package_dependency_graph_enricher" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_package_dependency_graph_enricher" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_package_dependency_graph_enricher" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_package_dependency_graph_enricher" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_package_dependency_graph_enricher)" stroke="url(#borderGrad_package_dependency_graph_enricher)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_package_dependency_graph_enricher)" />
  
        <g stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1.5">
          <line x1="60" y1="140" x2="452" y2="330" />
          <line x1="60" y1="200" x2="452" y2="390" />
          <line x1="60" y1="260" x2="452" y2="450" />
          <line x1="452" y1="140" x2="60" y2="330" />
          <line x1="452" y1="200" x2="60" y2="390" />
          <line x1="452" y1="260" x2="60" y2="450" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_package_dependency_graph_enricher)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_package_dependency_graph_enricher)">
    
    <!-- Directed Acyclic Graph (DAG) Network -->
    <g stroke="#38BDF8" stroke-width="3" fill="#0F172A">
      <line x1="256" y1="160" x2="190" y2="230" /><circle cx="256" cy="160" r="18" stroke="#4285F4" stroke-width="3" />
      <line x1="256" y1="160" x2="322" y2="230" /><circle cx="190" cy="230" r="16" stroke="#34A853" stroke-width="3" />
      <line x1="190" y1="230" x2="220" y2="300" /><circle cx="322" cy="230" r="16" stroke="#FBBC05" stroke-width="3" />
      <line x1="322" y1="230" x2="290" y2="300" /><circle cx="220" cy="300" r="14" stroke="#EA4335" stroke-width="3" />
      <line x1="220" y1="300" x2="290" y2="300" /><circle cx="290" cy="300" r="14" stroke="#34A853" stroke-width="3" />
    </g>
    <!-- deps.dev Pill -->
    <rect x="146" y="356" width="220" height="36" rx="18" fill="#1E293B" stroke="#4285F4" stroke-width="2.5" />
    <text x="256" y="379" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">GOOGLE DEPS.DEV GRAPH</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_package_dependency_graph_enricher)">
    <rect x="282" y="56" width="166" height="42" rx="21" fill="#1E293B" stroke="#4285F4" stroke-width="2.2" />
    <circle cx="302" cy="77" r="5.5" fill="#EA4335" filter="url(#softGlow_package_dependency_graph_enricher)" />
    <text x="374" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FFFFFF" letter-spacing="1.5">DEPS.DEV</text>
  </g>
</svg>