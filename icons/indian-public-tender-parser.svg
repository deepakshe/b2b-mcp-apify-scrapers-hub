<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_indian_public_tender_parser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" /><stop offset="50%" stop-color="#141C33" /><stop offset="100%" stop-color="#0A1324" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_indian_public_tender_parser" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.95" /><stop offset="50%" stop-color="#138808" stop-opacity="0.6" /><stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_indian_public_tender_parser" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#FF9933" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FF9933" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_indian_public_tender_parser" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_indian_public_tender_parser" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_indian_public_tender_parser" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_indian_public_tender_parser" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_indian_public_tender_parser)" stroke="url(#borderGrad_indian_public_tender_parser)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_indian_public_tender_parser)" />
  
        <g stroke="#F59E0B" stroke-opacity="0.12" fill="none" stroke-width="1.5">
          <circle cx="256" cy="256" r="90" />
          <circle cx="256" cy="256" r="140" stroke-dasharray="6 6" />
          <circle cx="256" cy="256" r="190" />
          <line x1="256" y1="60" x2="256" y2="452" stroke-opacity="0.08" />
          <line x1="60" y1="256" x2="452" y2="256" stroke-opacity="0.08" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_indian_public_tender_parser)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_indian_public_tender_parser)">
    
    <!-- Indian Ashoka Chakra Wheel -->
    <circle cx="256" cy="220" r="75" fill="none" stroke="#000080" stroke-width="6" />
    <circle cx="256" cy="220" r="14" fill="#000080" />
    <!-- 24 Spokes representation -->
    <g stroke="#000080" stroke-width="2">
      <line x1="256" y1="145" x2="256" y2="295" />
      <line x1="181" y1="220" x2="331" y2="220" />
      <line x1="203" y1="167" x2="309" y2="273" />
      <line x1="203" y1="273" x2="309" y2="167" />
    </g>
    <!-- Golden Procurement Gavel & Tender Scroll -->
    <rect x="140" y="330" width="232" height="40" rx="10" fill="#FF9933" stroke="#FFFFFF" stroke-width="2" />
    <text x="256" y="355" font-family="sans-serif" font-weight="900" font-size="15" fill="#000080" text-anchor="middle">BHARAT e-TENDERS</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_indian_public_tender_parser)">
    <rect x="250" y="56" width="198" height="42" rx="21" fill="#172554" stroke="#FF9933" stroke-width="2.2" />
    <circle cx="270" cy="77" r="5.5" fill="#FBBF24" filter="url(#softGlow_indian_public_tender_parser)" />
    <text x="358" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FEF3C7" letter-spacing="1.5">GeM / CPPP</text>
  </g>
</svg>