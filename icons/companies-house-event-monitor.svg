<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_companies_house_event_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101E" /><stop offset="50%" stop-color="#101D36" /><stop offset="100%" stop-color="#060C17" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_companies_house_event_monitor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.95" /><stop offset="50%" stop-color="#EF4444" stop-opacity="0.5" /><stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_companies_house_event_monitor" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_companies_house_event_monitor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_companies_house_event_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_companies_house_event_monitor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_companies_house_event_monitor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_companies_house_event_monitor)" stroke="url(#borderGrad_companies_house_event_monitor)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_companies_house_event_monitor)" />
  
        <g stroke="#F59E0B" stroke-opacity="0.12" fill="none" stroke-width="1.5">
          <circle cx="256" cy="256" r="90" />
          <circle cx="256" cy="256" r="140" stroke-dasharray="6 6" />
          <circle cx="256" cy="256" r="190" />
          <line x1="256" y1="60" x2="256" y2="452" stroke-opacity="0.08" />
          <line x1="60" y1="256" x2="452" y2="256" stroke-opacity="0.08" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_companies_house_event_monitor)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_companies_house_event_monitor)">
    
    <!-- British Crown & Royal Crest -->
    <path d="M 190 260 L 322 260 L 332 200 L 290 225 L 256 170 L 222 225 L 180 200 Z" fill="#D97706" stroke="#FEF08A" stroke-width="3" />
    <rect x="190" y="260" width="132" height="18" rx="4" fill="#00247D" />
    <circle cx="210" cy="269" r="4" fill="#FFFFFF" />
    <circle cx="256" cy="269" r="4" fill="#FFFFFF" />
    <circle cx="302" cy="269" r="4" fill="#FFFFFF" />
    <!-- UK Companies House Official Pill -->
    <rect x="146" y="340" width="220" height="42" rx="10" fill="#00247D" stroke="#FFFFFF" stroke-width="2.5" />
    <text x="256" y="366" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">COMPANIES HOUSE UK</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_companies_house_event_monitor)">
    <rect x="282" y="56" width="166" height="42" rx="21" fill="#1E293B" stroke="#F59E0B" stroke-width="2.2" />
    <circle cx="302" cy="77" r="5.5" fill="#FBBF24" filter="url(#softGlow_companies_house_event_monitor)" />
    <text x="374" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#FEF3C7" letter-spacing="1.5">UK CREST</text>
  </g>
</svg>