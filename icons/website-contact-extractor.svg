<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_website_contact_extractor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D1A" /><stop offset="50%" stop-color="#151C3B" /><stop offset="100%" stop-color="#1E295A" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_website_contact_extractor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" /><stop offset="50%" stop-color="#818CF8" stop-opacity="0.4" /><stop offset="100%" stop-color="#C084FC" stop-opacity="0.7" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_website_contact_extractor" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_website_contact_extractor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_website_contact_extractor" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_website_contact_extractor" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_website_contact_extractor" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_website_contact_extractor)" stroke="url(#borderGrad_website_contact_extractor)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_website_contact_extractor)" />
  
        <g stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1.5">
          <line x1="60" y1="140" x2="452" y2="330" />
          <line x1="60" y1="200" x2="452" y2="390" />
          <line x1="60" y1="260" x2="452" y2="450" />
          <line x1="452" y1="140" x2="60" y2="330" />
          <line x1="452" y1="200" x2="60" y2="390" />
          <line x1="452" y1="260" x2="60" y2="450" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_website_contact_extractor)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_website_contact_extractor)">
    
        <!-- Web Browser Extracting Verified Leads -->
        <rect x="136" y="150" width="240" height="170" rx="18" fill="#0B132B" stroke="#0EA5E9" stroke-width="3" />
        <rect x="136" y="150" width="240" height="32" rx="18" fill="#1E293B" />
        <circle cx="156" cy="166" r="4.5" fill="#EF4444" />
        <circle cx="170" cy="166" r="4.5" fill="#F59E0B" />
        <circle cx="184" cy="166" r="4.5" fill="#10B981" />
        <!-- Floating Extracted Cards -->
        <rect x="170" y="210" width="172" height="120" rx="14" fill="#0369A1" stroke="#38BDF8" stroke-width="2.5" />
        <circle cx="205" cy="245" r="16" fill="#38BDF8" />
        <rect x="232" y="235" width="80" height="8" rx="4" fill="#FFFFFF" />
        <rect x="232" y="250" width="60" height="6" rx="3" fill="#BAE6FD" />
        <rect x="190" y="280" width="132" height="24" rx="8" fill="#0284C7" />
        <text x="256" y="296" font-family="sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">PHONE + EMAIL</text>
        
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_website_contact_extractor)">
    <rect x="336" y="56" width="112" height="42" rx="21" fill="#082F49" stroke="#0EA5E9" stroke-width="2.2" />
    <circle cx="356" cy="77" r="5.5" fill="#38BDF8" filter="url(#softGlow_website_contact_extractor)" />
    <text x="401" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#F0F9FF" letter-spacing="1.5">LEAD</text>
  </g>
</svg>