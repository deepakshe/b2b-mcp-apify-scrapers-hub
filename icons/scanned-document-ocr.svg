<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad_scanned_document_ocr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06121E" /><stop offset="50%" stop-color="#0D2238" /><stop offset="100%" stop-color="#040D17" />
    </linearGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="borderGrad_scanned_document_ocr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95" /><stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.5" /><stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Glowing Orb Gradient -->
    <radialGradient id="glowOrb_scanned_document_ocr" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.55" />
      <stop offset="70%" stop-color="#0EA5E9" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.0" />
    </radialGradient>

    <!-- Top Specular Reflection Gradient (macOS Glass Arc) -->
    <linearGradient id="specularGrad_scanned_document_ocr" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Hero Deep Elevation Drop Shadow -->
    <filter id="heroShadow_scanned_document_ocr" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Soft Glow Filter -->
    <filter id="softGlow_scanned_document_ocr" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Micro Badge Drop Shadow -->
    <filter id="badgeShadow_scanned_document_ocr" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- ================= LAYER 1: SQUIRCLE BASE ================= -->
  <rect x="32" y="32" width="448" height="448" rx="108" ry="108" fill="url(#bgGrad_scanned_document_ocr)" stroke="url(#borderGrad_scanned_document_ocr)" stroke-width="3.5" />

  <!-- ================= LAYER 2: AMBIENT GLOW & TEXTURE ================= -->
  <circle cx="256" cy="245" r="150" fill="url(#glowOrb_scanned_document_ocr)" />
  
        <g stroke="#8B5CF6" stroke-opacity="0.14" fill="none" stroke-width="1.8">
          <path d="M 60 256 L 140 256 L 160 220 L 180 290 L 200 230 L 220 270 L 240 256 L 452 256" />
          <line x1="60" y1="170" x2="452" y2="170" stroke-opacity="0.07" stroke-dasharray="4 6" />
          <line x1="60" y1="340" x2="452" y2="340" stroke-opacity="0.07" stroke-dasharray="4 6" />
        </g>
        

  <!-- ================= LAYER 3: TOP SPECULAR GLASS REFLECTION ================= -->
  <path d="M 48 140 C 48 70, 70 48, 140 48 L 372 48 C 442 48, 464 70, 464 140 C 464 175, 410 195, 256 195 C 102 195, 48 175, 48 140 Z" fill="url(#specularGrad_scanned_document_ocr)" />

  <!-- ================= LAYER 4: BESPOKE 3D HERO ILLUSTRATION ================= -->
  <g filter="url(#heroShadow_scanned_document_ocr)">
    
    <!-- Document Sheet -->
    <rect x="160" y="150" width="192" height="170" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" />
    <rect x="180" y="180" width="152" height="8" rx="4" fill="#64748B" />
    <rect x="180" y="200" width="130" height="8" rx="4" fill="#64748B" />
    <rect x="180" y="220" width="152" height="8" rx="4" fill="#64748B" />
    <rect x="180" y="240" width="100" height="8" rx="4" fill="#64748B" />
    <!-- Glowing Laser Scanner Bar -->
    <line x1="140" y1="210" x2="372" y2="210" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round" />
    <line x1="140" y1="210" x2="372" y2="210" stroke="#38BDF8" stroke-width="14" stroke-opacity="0.3" stroke-linecap="round" />
    <!-- OCR Engine Pill -->
    <rect x="146" y="356" width="220" height="36" rx="18" fill="#082F49" stroke="#0EA5E9" stroke-width="2.5" />
    <text x="256" y="379" font-family="sans-serif" font-weight="900" font-size="13" fill="#FFFFFF" text-anchor="middle">PDF &amp; IMAGE TO TEXT</text>
    
  </g>

  <!-- ================= LAYER 5: HIGH-CONTRAST METALLIC MICRO-BADGE ================= -->
  <g filter="url(#badgeShadow_scanned_document_ocr)">
    <rect x="250" y="56" width="198" height="42" rx="21" fill="#082F49" stroke="#0EA5E9" stroke-width="2.2" />
    <circle cx="270" cy="77" r="5.5" fill="#38BDF8" filter="url(#softGlow_scanned_document_ocr)" />
    <text x="358" y="84" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="18" text-anchor="middle" fill="#F0F9FF" letter-spacing="1.5">VISION OCR</text>
  </g>
</svg>